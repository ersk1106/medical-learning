<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 730'><rect width='1000' height='730' fill='white'/><text x='30' y='44' font-size='30' font-weight='bold' fill='#2b2b2b' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>図2　医事課の区分選択フロー（医科）</text><rect x='300' y='70' width='400' height='60' rx='12' fill='#eef3fa' stroke='#cfcfcf'/><text x='500.0' y='107' font-size='21' fill='#2b2b2b' text-anchor='middle' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>意識消失を伴う吸入・静脈麻酔か？</text><line x1='500' y1='130' x2='500.0' y2='158.0' stroke='#888' stroke-width='3'/><polygon points='500,170 493.0,155.6 507.0,155.6' fill='#888'/><rect x='300' y='170' width='400' height='60' rx='12' fill='#eef3fa' stroke='#cfcfcf'/><text x='500.0' y='207' font-size='21' fill='#2b2b2b' text-anchor='middle' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>声門上器具・気管挿管で気道確保？</text><line x1='700' y1='200' x2='778.0' y2='200.0' stroke='#888' stroke-width='3'/><polygon points='790,200 775.6,207.0 775.6,193.0' fill='#888'/><rect x='790' y='170' width='180' height='60' rx='12' fill='#fbeaea' stroke='#cfcfcf'/><text x='880.0' y='207' font-size='21' fill='#2b2b2b' text-anchor='middle' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>L008 全身麻酔</text><text x='735' y='190' font-size='18' fill='#666666' text-anchor='middle' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>はい</text><line x1='500' y1='230' x2='500.0' y2='258.0' stroke='#888' stroke-width='3'/><polygon points='500,270 493.0,255.6 507.0,255.6' fill='#888'/><text x='520' y='258' font-size='18' fill='#666666' text-anchor='start' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>いいえ</text><rect x='300' y='270' width='400' height='60' rx='12' fill='#eef3fa' stroke='#cfcfcf'/><text x='500.0' y='307' font-size='21' fill='#2b2b2b' text-anchor='middle' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>実施時間は20分以上？</text><line x1='300' y1='300' x2='222.0' y2='300.0' stroke='#888' stroke-width='3'/><polygon points='210,300 224.4,293.0 224.4,307.0' fill='#888'/><rect x='30' y='270' width='180' height='60' rx='12' fill='#eef7f1' stroke='#cfcfcf'/><text x='120.0' y='307' font-size='21' fill='#2b2b2b' text-anchor='middle' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>L001 鎮静</text><text x='255' y='290' font-size='18' fill='#666666' text-anchor='middle' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>未満</text><text x='110' y='360' font-size='18' fill='#666666' text-anchor='middle' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>10分未満 120点</text><text x='110' y='386' font-size='18' fill='#666666' text-anchor='middle' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>10〜20分 310点</text><line x1='500' y1='330' x2='500.0' y2='358.0' stroke='#888' stroke-width='3'/><polygon points='500,370 493.0,355.6 507.0,355.6' fill='#888'/><text x='520' y='358' font-size='18' fill='#666666' text-anchor='start' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>以上</text><rect x='250' y='370' width='500' height='60' rx='12' fill='#fff4e5' stroke='#cfcfcf'/><text x='500.0' y='407' font-size='21' fill='#2b2b2b' text-anchor='middle' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>L007 深鎮静：誰が・どの体制で行ったか？</text><rect x='250' y='450' width='500' height='44' rx='8' fill='#fafafa' stroke='#e2e2e2'/><text x='270' y='479' font-size='19' fill='#2b2b2b' text-anchor='start' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>麻酔科標榜医が専従（届出）</text><text x='730' y='479' font-size='19' fill='#c0392b' text-anchor='end' font-weight='bold' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>2,600点</text><rect x='250' y='502' width='500' height='44' rx='8' fill='#fafafa' stroke='#e2e2e2'/><text x='270' y='531' font-size='19' fill='#2b2b2b' text-anchor='start' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>標榜医の指導下で専従（届出）</text><text x='730' y='531' font-size='19' fill='#c0392b' text-anchor='end' font-weight='bold' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>1,700点</text><rect x='250' y='554' width='500' height='44' rx='8' fill='#fafafa' stroke='#e2e2e2'/><text x='270' y='583' font-size='19' fill='#2b2b2b' text-anchor='start' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>麻酔を専従で実施</text><text x='730' y='583' font-size='19' fill='#c0392b' text-anchor='end' font-weight='bold' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>900点</text><rect x='250' y='606' width='500' height='44' rx='8' fill='#fafafa' stroke='#e2e2e2'/><text x='270' y='635' font-size='19' fill='#2b2b2b' text-anchor='start' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>それ以外</text><text x='730' y='635' font-size='19' fill='#c0392b' text-anchor='end' font-weight='bold' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>600点</text><rect x='30' y='670' width='940' height='40' rx='8' fill='#f5f5f5'/><text x='46' y='697' font-size='19' fill='#666666' text-anchor='start' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>記録で確認するもの：開始・終了時刻（静脈麻酔は初回投与〜処置終了）、深さの評価、担当者、届出の有無</text></svg>