<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 1010'>
<rect width='1000' height='1010' fill='white'/>
<text x='30' y='34' font-size='30' font-weight='bold' fill='#2b2b2b' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>図2　穿頭血腫洗浄術の流れ（所要30分〜1時間）</text>
<rect x='20' y='70' width='960' height='210' rx='14' fill='#fafafa' stroke='#e2e2e2'/><rect x='60' y='130' width='300' height='26' fill='#e9c9ae' stroke='none'/><rect x='60' y='156' width='300' height='28' fill='#f1ede2' stroke='#b8ad94'/><rect x='60' y='184' width='300' height='5' fill='#4a6fa5' stroke='none'/><path d='M60,189 L360,189 L360,207.4 Q210.0,262.6 60,207.4 Z' fill='#7d5a44'/><rect x='60' y='207.4' width='300' height='62.599999999999994' fill='#f2d7dc' opacity='0.0'/><path d='M60,207.4 Q210.0,262.6 360,207.4 L360,280 L60,280 Z' fill='#f2d7dc' stroke='#c99aa5' stroke-width='2'/><line x1='180.0' y1='128' x2='240.0' y2='128' stroke='#c0392b' stroke-width='5' stroke-dasharray='8 5'/><line x1='255.0' y1='90' x2='230.0' y2='138' stroke='#888' stroke-width='5'/><rect x='250.0' y='68' width='18' height='28' fill='#ddd' stroke='#888' transform='rotate(30 259.0 82)'/><circle cx='420' cy='120' r='22' fill='#4a6fa5'/><text x='420' y='128' font-size='24' fill='white' text-anchor='middle' font-weight='bold' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>1</text><text x='452' y='128' font-size='25' font-weight='bold' fill='#2b2b2b' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>局所麻酔をして、</text><text x='452' y='162' font-size='25' font-weight='bold' fill='#2b2b2b' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>皮膚を3〜5cm切る</text><text x='452' y='208' font-size='20' fill='#666666' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>患者さんは目を覚ましたまま。</text><text x='452' y='236' font-size='20' fill='#666666' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>会話しながら進めることが多い</text><rect x='20' y='300' width='960' height='210' rx='14' fill='#fafafa' stroke='#e2e2e2'/><rect x='60' y='360' width='300' height='26' fill='#e9c9ae' stroke='none'/><rect x='60' y='386' width='300' height='28' fill='#f1ede2' stroke='#b8ad94'/><rect x='60' y='414' width='300' height='5' fill='#4a6fa5' stroke='none'/><path d='M60,419 L360,419 L360,437.4 Q210.0,492.6 60,437.4 Z' fill='#7d5a44'/><rect x='60' y='437.4' width='300' height='62.599999999999994' fill='#f2d7dc' opacity='0.0'/><path d='M60,437.4 Q210.0,492.6 360,437.4 L360,510 L60,510 Z' fill='#f2d7dc' stroke='#c99aa5' stroke-width='2'/><rect x='192.0' y='360' width='36' height='59' fill='white'/><rect x='202.0' y='315' width='16' height='35' fill='#999'/><polygon points='202.0,350 218.0,350 210.0,368' fill='#777'/><circle cx='420' cy='350' r='22' fill='#4a6fa5'/><text x='420' y='358' font-size='24' fill='white' text-anchor='middle' font-weight='bold' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>2</text><text x='452' y='358' font-size='25' font-weight='bold' fill='#2b2b2b' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>ドリルで頭蓋骨に</text><text x='452' y='392' font-size='25' font-weight='bold' fill='#2b2b2b' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>1〜1.5cmの穴を開ける（穿頭）</text><text x='452' y='438' font-size='20' fill='#666666' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>頭蓋骨を大きく外す</text><text x='452' y='466' font-size='20' fill='#666666' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>「開頭」とは違う</text><rect x='20' y='530' width='960' height='210' rx='14' fill='#fafafa' stroke='#e2e2e2'/><rect x='60' y='590' width='300' height='26' fill='#e9c9ae' stroke='none'/><rect x='60' y='616' width='300' height='28' fill='#f1ede2' stroke='#b8ad94'/><rect x='60' y='644' width='300' height='5' fill='#4a6fa5' stroke='none'/><path d='M60,649 L360,649 L360,667.4 Q210.0,722.6 60,667.4 Z' fill='#7d5a44'/><rect x='60' y='667.4' width='300' height='62.599999999999994' fill='#f2d7dc' opacity='0.0'/><path d='M60,667.4 Q210.0,722.6 360,667.4 L360,740 L60,740 Z' fill='#f2d7dc' stroke='#c99aa5' stroke-width='2'/><rect x='192.0' y='590' width='36' height='59' fill='white'/><rect x='204.0' y='550' width='12' height='105' fill='#3d8b6e' rx='4'/><path d='M140.0,685 q0,-25 42,-30' fill='none' stroke='#5aa9e6' stroke-width='4'/><path d='M280.0,685 q0,-25 -42,-30' fill='none' stroke='#5aa9e6' stroke-width='4'/><path d='M180.0,570 l-18,-20' stroke='#7d5a44' stroke-width='6'/><path d='M240.0,570 l18,-20' stroke='#5aa9e6' stroke-width='6'/><circle cx='420' cy='580' r='22' fill='#4a6fa5'/><text x='420' y='588' font-size='24' fill='white' text-anchor='middle' font-weight='bold' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>3</text><text x='452' y='588' font-size='25' font-weight='bold' fill='#2b2b2b' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>硬膜を開け、血腫を出して</text><text x='452' y='622' font-size='25' font-weight='bold' fill='#2b2b2b' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>生理食塩水で洗う</text><text x='452' y='668' font-size='20' fill='#666666' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>黒っぽい液体状の血腫が</text><text x='452' y='696' font-size='20' fill='#666666' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>流れ出てくる</text><rect x='20' y='760' width='960' height='210' rx='14' fill='#fafafa' stroke='#e2e2e2'/><rect x='60' y='820' width='300' height='26' fill='#e9c9ae' stroke='none'/><rect x='60' y='846' width='300' height='28' fill='#f1ede2' stroke='#b8ad94'/><rect x='60' y='874' width='300' height='5' fill='#4a6fa5' stroke='none'/><path d='M60,879 L360,879 L360,883.0 Q210.0,895.0 60,883.0 Z' fill='#7d5a44'/><rect x='60' y='883.0' width='300' height='77.0' fill='#f2d7dc' opacity='0.0'/><path d='M60,883.0 Q210.0,895.0 360,883.0 L360,970 L60,970 Z' fill='#f2d7dc' stroke='#c99aa5' stroke-width='2'/><rect x='192.0' y='820' width='36' height='59' fill='white'/><path d='M210.0,886 L210.0,800 Q210.0,780 250.0,780 L320.0,780' fill='none' stroke='#3d8b6e' stroke-width='9' stroke-linecap='round'/><rect x='318.0' y='758' width='30' height='40' rx='6' fill='#f3e7df' stroke='#7d5a44' stroke-width='2'/><circle cx='420' cy='810' r='22' fill='#4a6fa5'/><text x='420' y='818' font-size='24' fill='white' text-anchor='middle' font-weight='bold' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>4</text><text x='452' y='818' font-size='25' font-weight='bold' fill='#2b2b2b' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>細い管（ドレーン）を</text><text x='452' y='852' font-size='25' font-weight='bold' fill='#2b2b2b' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>残して閉じる</text><text x='452' y='898' font-size='20' fill='#666666' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>1〜2日、残った液を排出。</text><text x='452' y='926' font-size='20' fill='#666666' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>CTで確認して抜く</text>
<text x='30' y='995' font-size='18' fill='#666666' font-family='Noto Sans CJK JP, Noto Sans CJK SC, sans-serif'>層の色：頭皮（肌色）／頭蓋骨（白）／硬膜（青線）／血腫（茶）／脳（ピンク）　※模式図</text>
</svg>